<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #181818;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cadastro-container {
      width: 100%;
      max-width: 480px;
      background-color: #242424;
      padding: 35px;
      border: 1px solid #c2185b;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(194, 24, 91, 0.15);
    }

    h1 {
      color: #ff4081;
      text-align: center;
      font-weight: bold;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-control {
      background-color: #303030;
      color: #fff;
      border: 1px solid #555;
      padding: 12px;
    }

    .form-control::placeholder {
      color: #bdbdbd;
    }

    .form-control:focus {
      background-color: #303030;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 0 0.2rem rgba(255, 64, 129, 0.2);
    }

    .btn-cadastrar {
      background-color: #c2185b;
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .btn-cadastrar:hover {
      background-color: #ff4081;
      color: #181818;
    }

    .texto-login {
      color: #bdbdbd;
    }

    .texto-login a {
      color: #ff4081;
      text-decoration: none;
      font-weight: bold;
    }

    .texto-login a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .icone {
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <main class="cadastro-container">
    <div class="icone">🎸</div>

    <h1>Criar conta</h1>

    <form id="form-cadastro">
      <div class="mb-3">
        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
      </div>

      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
      </div>

      <div class="mb-4">
        <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      </div>

      <button type="submit" class="btn btn-cadastrar w-100">Cadastrar</button>
    </form>

    <p class="texto-login mt-4 text-center">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
