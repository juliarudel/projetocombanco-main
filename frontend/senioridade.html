<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Senioridade — Estúdio de Tatuagem</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="container py-4">

  <!-- Navbar idêntica ao molde do roteiro -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3 text-decoration-none">Clientes</a>
        <a href="senioridade.html" class="text-light me-3 text-decoration-none fw-bold">Senioridade</a>
        <a href="estilos.html" class="text-light me-3 text-decoration-none">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3 text-decoration-none">Tatuadores</a>
        <a href="agendamentos.html" class="text-light me-3 text-decoration-none">Agendamentos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <h1>Senioridade</h1>

  <!-- Formulário para cadastrar nova senioridade -->
  <form id="form-senioridade" class="row g-2 mt-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="nome" class="form-control" placeholder="Nome (ex: Júnior)" required>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-senioridade" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde as senioridades vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- as senioridades vão aparecer aqui -->
    </tbody>
  </table>

  <!-- Ordem correta de scripts -->
  <script src="js/auth.js"></script>
  <script src="js/senioridade.js"></script>

</body>
</html>
