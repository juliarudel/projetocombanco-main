
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Estúdio de Tatuagem</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #181818;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Caixa de login */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background-color: #252525;
            border: 1px solid #444;
            border-top: 4px solid #c2185b;
            border-radius: 10px;
        }

        /* Título */
        h1 {
            color: #ff4081;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #bbb;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Ícone */
        .icone-rock {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* Campos */
        .form-control {
            background-color: #333;
            color: white;
            border: 1px solid #666;
            padding: 12px;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .form-control:focus {
            background-color: #333;
            color: white;
            border-color: #ff4081;
            box-shadow: none;
        }

        /* Botão */
        .btn-primary {
            background-color: #c2185b;
            border-color: #c2185b;
            padding: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background-color: #880e4f;
            border-color: #880e4f;
        }

        /* Texto inferior */
        .aviso {
            color: #bbb;
            font-size: 13px;
            text-align: center;
            margin-top: 22px;
            margin-bottom: 0;
        }

        .linha-decorativa {
            width: 60px;
            height: 3px;
            background-color: #c2185b;
            margin: 15px auto 25px;
        }
    </style>
</head>

<body class="p-3">

    <div class="login-container">

        <div class="icone-rock">🎸</div>

        <h1>Estúdio de Tatuagem</h1>

        <p class="subtitulo">Acesso ao sistema</p>

        <div class="linha-decorativa"></div>

        <!-- Formulário de login -->
        <form id="form-login">

            <div class="mb-3">
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="E-mail"
                    autocomplete="username"
                    required>
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    id="senha"
                    class="form-control"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

        <p class="aviso">
            O cadastro de funcionários é feito por um administrador.
        </p>

    </div>

    <!-- JavaScript original do login -->
    <script src="js/login.js"></script>

</body>
</html>
