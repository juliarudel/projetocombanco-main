<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #181818;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .navbar {
      background-color: #101010 !important;
      border-bottom: 2px solid #c2185b;
      padding: 15px;
    }

    .navbar-brand {
      color: #ff4081 !important;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav-link {
      color: #f5f5f5 !important;
      transition: 0.2s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ff4081 !important;
    }

    .btn-sair {
      border: 1px solid #ff4081;
      color: #ff4081;
    }

    .btn-sair:hover {
      background-color: #c2185b;
      color: white;
    }

    h1 {
      color: #ff4081;
      font-weight: bold;
      margin: 30px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .formulario {
      background-color: #242424;
      padding: 20px;
      border: 1px solid #383838;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .form-control {
      background-color: #303030;
      color: #fff;
      border: 1px solid #555;
    }

    .form-control::placeholder {
      color: #bdbdbd;
    }

    .form-control:focus {
      background-color: #303030;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 0 0.2rem rgba(255, 64, 129, 0.2);
    }

    .btn-cadastrar {
      background-color: #c2185b;
      color: white;
      border: none;
      font-weight: bold;
    }

    .btn-cadastrar:hover {
      background-color: #ff4081;
      color: #181818;
    }

    .tabela-container {
      background-color: #242424;
      padding: 15px;
      border: 1px solid #383838;
      border-radius: 10px;
    }

    .table {
      color: #f5f5f5;
      margin-bottom: 0;
      vertical-align: middle;
    }

    .table thead th {
      background-color: #101010;
      color: #ff4081;
      border-bottom: 2px solid #c2185b;
      white-space: nowrap;
    }

    .table tbody td {
      background-color: #242424;
      color: #f5f5f5;
      border-color: #444;
    }

    .table tbody tr:hover td {
      background-color: #303030;
    }

    .btn-edit {
      background-color: #00bcd4;
      color: #181818;
      border: none;
      font-weight: bold;
    }

    .btn-edit:hover {
      background-color: #80deea;
      color: #181818;
    }

    .btn-del {
      background-color: #c2185b;
      color: white;
      border: none;
      font-weight: bold;
    }

    .btn-del:hover {
      background-color: #ff4081;
      color: #181818;
    }

    @media (max-width: 768px) {
      .navbar-nav {
        padding-top: 10px;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a href="dashboard.html" class="navbar-brand">🎸 Estúdio de Tatuagem</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar" aria-controls="menuNavbar" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a href="clientes.html" class="nav-link active">Clientes</a>
          </li>
          <li class="nav-item">
            <a href="senioridade.html" class="nav-link">Senioridade</a>
          </li>
          <li class="nav-item">
            <a href="estilos.html" class="nav-link">Estilos</a>
          </li>
          <li class="nav-item">
            <a href="tatuadores.html" class="nav-link">Tatuadores</a>
          </li>
          <li class="nav-item">
            <a href="agendamentos.html" class="nav-link">Agendamentos</a>
          </li>
          <li class="nav-item ms-lg-2">
            <button onclick="sair()" class="btn btn-sair btn-sm">Sair</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-4">

    <h1>⚡ Clientes ⚡</h1>

    <form id="form-cliente" class="formulario">
      <div class="row g-3 align-items-center">

        <div class="col-md-3">
          <input type="text" id="nome" class="form-control" placeholder="Nome" required>
        </div>

        <div class="col-md-2">
          <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
        </div>

        <div class="col-md-2">
          <input type="text" id="telefone" class="form-control" placeholder="Telefone">
        </div>

        <div class="col-md-2">
          <input type="text" id="cidade" class="form-control" placeholder="Cidade">
        </div>

        <div class="col-md-1">
          <input type="text" id="uf" class="form-control" placeholder="UF" maxlength="2">
        </div>

        <div class="col-md-2">
          <button id="btn-submit-cliente" type="submit" class="btn btn-cadastrar w-100">Cadastrar
          </button>
        </div>

      </div>
    </form>

    <div class="tabela-container">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th>Cidade</th>
              <th>UF</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
