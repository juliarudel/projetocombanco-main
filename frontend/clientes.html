<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Estúdio de Tatuagem</title>
  
  <!-- Estilos essenciais injetados diretamente para corrigir o visual sem usar internet -->
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8f9fa; padding: 1.5rem; }
    .container { max-width: 1140px; margin: 0 auto; }
    .navbar { background-color: #212529; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; border-radius: 0.375rem; margin-bottom: 1.5rem; }
    .navbar-brand { color: #fff; font-size: 1.25rem; font-weight: bold; text-decoration: none; }
    .nav-links a { color: #f8f9fa; text-decoration: none; margin-right: 1rem; font-size: 0.9rem; }
    .nav-links a.active { font-weight: bold; }
    .btn-sair { background: none; border: 1px solid #f8f9fa; color: #f8f9fa; padding: 0.25rem 0.5rem; font-size: 0.875rem; border-radius: 0.25rem; cursor: pointer; }
    .btn-sair:hover { background-color: #f8f9fa; color: #212529; }
    h1 { color: #212529; margin-bottom: 1.5rem; }
    .form-row { background: #fff; padding: 1rem; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .form-control { flex: 1; min-width: 120px; padding: 0.375rem 0.75rem; font-size: 1rem; border: 1px solid #ced4da; border-radius: 0.375rem; }
    .btn-cadastrar { background-color: #0d6efd; color: #fff; border: none; padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-weight: bold; }
    .btn-cadastrar:hover { background-color: #0b5ed7; }
    .table-responsive { background: #fff; padding: 0.5rem; border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: #212529; color: #fff; padding: 0.75rem; font-size: 0.9rem; }
    td { padding: 0.75rem; border-bottom: 1px solid #dee2e6; font-size: 0.95rem; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .btn-edit { background-color: #ffc107; border: none; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; margin-right: 0.25rem; }
    .btn-del { background-color: #dc3545; color: #fff; border: none; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; }
  </style>
</head>
<body class="container">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#" class="navbar-brand">Estúdio de Tatuagem</a>
    <div class="nav-links">
      <a href="clientes.html" class="active">Clientes</a>
      <a href="senioridade.html">Senioridade</a>
      <a href="estilos.html">Estilos</a>
      <a href="tatuadores.html">Tatuadores</a>
      <a href="agendamentos.html">Agendamentos</a>
      <button onclick="sair()" class="btn-sair">Sair</button>
    </div>
  </nav>

  <h1>Clientes</h1>

  <!-- Formulário -->
  <form id="form-cliente" class="form-row">
    <input type="text" id="nome" class="form-control" placeholder="Nome" required>
    <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    <input type="text" id="cidade" class="form-control" placeholder="Cidade">
    <input type="text" id="uf" class="form-control" placeholder="UF" maxlength="2" style="max-width: 60px;">
    <button id="btn-submit-cliente" type="submit" class="btn-cadastrar">Cadastrar</button>
  </form>

  <!-- Tabela -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Cidade</th>
          <th>UF</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- Os dados vão aparecer aqui via JS -->
      </tbody>
    </table>
  </div>

  <!-- Scripts do sistema -->
  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>

</body>
</html>
