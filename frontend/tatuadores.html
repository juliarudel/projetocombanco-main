<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="container py-4">

  <!-- Navbar idêntica ao molde do roteiro -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3 text-decoration-none">Clientes</a>
        <a href="senioridade.html" class="text-light me-3 text-decoration-none">Senioridade</a>
        <a href="estilos.html" class="text-light me-3 text-decoration-none">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3 text-decoration-none fw-bold">Tatuadores</a>
        <a href="agendamentos.html" class="text-light me-3 text-decoration-none">Agendamentos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar novo tatuador -->
  <form id="form-tatuador" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail">
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
      </select>
    </div>

    <!-- Caixa de seleção múltipla para marcar os estilos -->
    <div class="col-md-12 my-2">
      <label class="form-label fw-bold">Estilos que domina</label>
      <div id="lista-estilos" class="d-flex flex-wrap gap-3">
        <!-- os checkboxes são preenchidos pelo JavaScript -->
      </div>
    </div>

    <div class="col-md-2 mt-2">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os tatuadores vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Estilos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
    </tbody>
  </table>

  <!-- Ordem correta de scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
