<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #181818;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .navbar {
      background-color: #101010 !important;
      border-bottom: 2px solid #c2185b;
    }

    .navbar-brand {
      color: #ff4081 !important;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .btn-sair {
      border: 1px solid #ff4081;
      color: #ff4081;
    }

    .btn-sair:hover {
      background-color: #c2185b;
      color: white;
    }

    h1 {
      color: #ff4081;
      font-weight: bold;
      text-align: center;
      margin-bottom: 35px !important;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .card-menu {
      background-color: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 10px;
      height: 100%;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card-menu:hover {
      transform: translateY(-5px);
      border-color: #ff4081;
    }

    .card-menu .btn {
      border: none;
      border-radius: 8px;
      padding: 18px 10px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-principal {
      background-color: #c2185b;
      color: white;
    }

    .btn-principal:hover {
      background-color: #ff4081;
      color: #181818;
    }

    .btn-secundario {
      background-color: #383838;
      color: #f5f5f5;
      border: 1px solid #555 !important;
    }

    .btn-secundario:hover {
      background-color: #ff4081;
      color: #181818;
    }

    .btn-funcionario {
      background-color: #087e8b;
      color: white;
    }

    .btn-funcionario:hover {
      background-color: #00bcd4;
      color: #181818;
    }

    .subtitulo {
      color: #bdbdbd;
      text-align: center;
      margin-top: -20px;
      margin-bottom: 30px;
    }

    footer {
      color: #777;
      text-align: center;
      padding: 30px 10px 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand">🎸 Estúdio de Tatuagem</span>
      <button onclick="sair()" class="btn btn-sair btn-sm">Sair</button>
    </div>
  </nav>

  <main class="container py-3">
    <h1>⚡ Painel Principal ⚡</h1>
    <p class="subtitulo">Gerencie seu estúdio de tatuagem</p>

    <!-- justify-content-center garante o alinhamento perfeito quando houver quebra de linha -->
    <div class="row g-3 justify-content-center">

      <!-- Botões Principais -->
      <div class="col-md-4">
        <div class="card-menu">
          <a href="clientes.html" class="btn btn-principal w-100">Clientes</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-menu">
          <a href="tatuadores.html" class="btn btn-principal w-100">Tatuadores</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-menu">
          <a href="agendamentos.html" class="btn btn-principal w-100">Agendamentos</a>
        </div>
      </div>

      <!-- Botões de Apoio alterados de cinza para rosa (btn-principal) -->
      <div class="col-md-4">
        <div class="card-menu">
          <a href="senioridade.html" class="btn btn-principal w-100">Senioridade</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-menu">
          <a href="estilos.html" class="btn btn-principal w-100">Estilos</a>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2026 Estúdio de Tatuagem API — Aula 15</p>
  </footer>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina() // Mantém a trava de segurança na página
  </script>

</body>
</html>
